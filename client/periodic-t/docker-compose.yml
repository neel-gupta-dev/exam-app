services:
  nextjs:
    build: .
    container_name: nextjs-app
    restart: unless-stopped
    expose:
      - "3000"  # Expose internally to Caddy only — not to the public internet!
    networks:
      - caddy_net
    # Auto-restart if the app becomes unresponsive
    # Uses Node.js directly since wget is not installed in node:alpine
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (r) => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Prevent Docker logs from filling up your disk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy_net:
    external: true