services:
  test-dashboard:
    build: .
    container_name: test-dashboard-app
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - caddy_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy_net:
    external: true
