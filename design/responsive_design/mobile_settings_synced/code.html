<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed": "#2f384f",
              "inverse-primary": "#494bd7",
              "on-background": "#dde6f2",
              "tertiary-container": "#ced6f5",
              "surface-container-lowest": "#000000",
              "secondary-container": "#3c3b3f",
              "primary-container": "#2f2ebe",
              "tertiary-dim": "#c0c9e6",
              "on-secondary-fixed-variant": "#5c5b5f",
              "primary": "#c0c1ff",
              "inverse-on-surface": "#535559",
              "surface": "#0b0e11",
              "secondary-dim": "#9f9da1",
              "error": "#ec7c8a",
              "on-surface-variant": "#a3acb7",
              "background": "#0b0e11",
              "tertiary-fixed-dim": "#c0c9e6",
              "surface-tint": "#c0c1ff",
              "on-tertiary": "#4a536c",
              "tertiary": "#dee5ff",
              "surface-variant": "#1e272f",
              "on-error-container": "#ff97a3",
              "on-secondary-container": "#c1bec3",
              "primary-fixed-dim": "#d1d0ff",
              "on-error": "#490013",
              "error-dim": "#b95463",
              "surface-container": "#141a20",
              "outline": "#6d7680",
              "surface-bright": "#222d37",
              "surface-dim": "#0b0e11",
              "on-secondary-fixed": "#403f43",
              "outline-variant": "#404952",
              "on-primary-fixed": "#2622b7",
              "on-primary": "#2724b8",
              "tertiary-fixed": "#ced6f5",
              "surface-container-high": "#192027",
              "on-tertiary-fixed-variant": "#4b546d",
              "surface-container-highest": "#1e272f",
              "on-primary-fixed-variant": "#4647d3",
              "error-container": "#7f2737",
              "surface-container-low": "#0f1418",
              "secondary-fixed-dim": "#d6d3d8",
              "secondary-fixed": "#e5e1e6",
              "on-secondary": "#202023",
              "primary-dim": "#b0b2ff",
              "secondary": "#9f9da1",
              "on-surface": "#dde6f2",
              "on-primary-container": "#ccccff",
              "inverse-surface": "#f8f9fe",
              "on-tertiary-container": "#424a63",
              "primary-fixed": "#e1e0ff"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #0b0e11;
        color: #dde6f2;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#0b0e11] dark:bg-[#0b0e11] flex items-center justify-between px-6 h-16 w-full max-w-none">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-indigo-500 dark:text-indigo-400 cursor-pointer active:scale-95 transition-transform">menu</span>
<h1 class="font-['Manrope'] font-bold tracking-tight text-lg text-indigo-500 font-black tracking-tighter text-xl">Vayl</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-indigo-500 dark:text-indigo-400 cursor-pointer active:scale-95 transition-transform">notifications</span>
</div>
</header>
<main class="pt-20 pb-24 px-6 max-w-2xl mx-auto">
<!-- Settings Header -->
<section class="mb-8">
<h2 class="font-headline text-3xl font-extrabold tracking-tight mb-2">Settings</h2>
<p class="text-on-surface-variant font-body text-sm">Configure your deep work environment and account preferences.</p>
</section>
<!-- Account Section -->
<div class="mb-10"><label class="font-label text-xs uppercase tracking-[0.2em] text-on-surface-variant font-bold mb-6 block">Account Profile</label>
<div class="space-y-6 bg-surface-container p-6 rounded-xl">
<div class="space-y-2">
<label class="text-[10px] font-semibold text-on-surface-variant uppercase tracking-widest">Full Name</label>
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 text-sm text-on-surface focus:ring-1 ring-primary/30 outline-none transition-all" type="text" value="Alexander Vance"/>
</div>
<div class="space-y-2">
<label class="text-[10px] font-semibold text-on-surface-variant uppercase tracking-widest">Email Address</label>
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 text-sm text-on-surface focus:ring-1 ring-primary/30 outline-none transition-all" type="email" value="alexander.v@scholar.io"/>
</div>
<div class="pt-4 border-t border-outline-variant/10">
<button class="w-full flex items-center justify-between py-2 text-sm font-medium text-on-surface hover:text-primary transition-colors">
<span>Change Password</span>
<span class="material-symbols-outlined text-sm">chevron_right</span>
</button>
</div>
</div></div>
<!-- Preferences Section -->
<div class="mb-10"><label class="font-label text-xs uppercase tracking-[0.2em] text-on-surface-variant font-bold mb-6 block">Preferences</label>
<div class="space-y-8">
<!-- Study Goals -->
<div class="bg-surface-container rounded-xl p-6 space-y-6">
<div class="flex justify-between items-center">
<div class="space-y-1">
<h3 class="font-headline font-bold text-on-surface text-sm">Daily Focus Target</h3>
<p class="text-[11px] text-on-surface-variant">Set desired deep work hours.</p>
</div>
<div class="flex items-center gap-3">
<button class="h-8 w-8 flex items-center justify-center rounded-lg bg-surface-variant text-on-surface hover:bg-surface-bright"><span class="material-symbols-outlined text-sm">remove</span></button>
<span class="text-lg font-headline font-bold">6h</span>
<button class="h-8 w-8 flex items-center justify-center rounded-lg bg-primary text-on-primary"><span class="material-symbols-outlined text-sm">add</span></button>
</div>
</div>
<div class="space-y-3">
<div class="flex justify-between text-[11px]">
<span class="text-on-surface-variant">Weekly Milestone</span>
<span class="text-primary font-bold">42 Hours</span>
</div>
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-2/3"></div>
</div>
</div>
</div>
<!-- Theme Selector (Mobile optimized cards) -->
<div class="space-y-4">
<label class="text-[10px] font-semibold text-on-surface-variant uppercase tracking-widest">Theme &amp; Appearance</label>
<div class="grid grid-cols-2 gap-3">
<button class="relative aspect-video rounded-xl bg-[#0b0e11] border-2 border-primary ring-2 ring-primary/10 overflow-hidden">
<div class="absolute bottom-2 right-2 h-4 w-4 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-[10px] text-on-primary">check</span></div>
<span class="absolute inset-0 flex items-center justify-center text-[10px] font-bold uppercase tracking-widest">Deep Focus</span>
</button>
<button class="relative aspect-video rounded-xl bg-[#1a1c20] border border-outline-variant/30 overflow-hidden">
<span class="absolute inset-0 flex items-center justify-center text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Obsidian</span>
</button>
</div>
</div>
<!-- Interface Scaling -->
<div class="space-y-4">
<label class="text-[10px] font-semibold text-on-surface-variant uppercase tracking-widest">Interface Scaling</label>
<div class="relative">
<select class="w-full bg-surface-container border-none rounded-xl px-4 py-3 text-sm text-on-surface focus:ring-1 ring-primary/30 outline-none appearance-none cursor-pointer">
<option>Compact (Default)</option>
<option>Standard</option>
<option>Comfortable</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</div></div>
<!-- System & Security -->
<!-- Sign Out -->
<footer class="mt-12 mb-6 flex flex-col gap-3">
<button class="w-full py-4 rounded-xl bg-primary text-on-primary font-bold shadow-lg shadow-primary/20 active:scale-95 transition-all">Save Preferences</button>
<button class="w-full py-3 rounded-xl text-on-surface-variant text-sm font-medium hover:bg-surface-container transition-all">Discard Changes</button>
</footer><button class="w-full py-4 rounded-xl bg-surface-container text-error font-headline font-bold active:scale-[0.98] transition-all mt-12">
            Sign Out
        </button>
</main>
<!-- BottomNavBar -->
</body></html>
