<!DOCTYPE html>

<html class="dark" lang="en"><head>

                extend: {

                        "surface-container-lowest": "#000000",

                        "secondary-container": "#3c3b3f",

                        "on-secondary-fixed-variant": "#5c5b5f",
                        "on-primary-fixed": "#2622b7",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0b0e11;
            color: #dde6f2;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.15;
        }
        .grid-pattern {
            background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="font-body selection:bg-primary/30 selection:text-primary min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Ambient Background Elements -->
<div class="orb bg-indigo-600 w-[500px] h-[500px] -top-48 -left-48"></div>
<div class="orb bg-primary w-[400px] h-[400px] -bottom-32 -right-32"></div>
<div class="orb bg-indigo-900 w-[300px] h-[300px] top-1/2 left-1/4 -translate-y-1/2 opacity-10"></div>
<div class="absolute inset-0 grid-pattern pointer-events-none opacity-40"></div>
<!-- Header / Brand -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-8 h-16">
<div class="flex items-center gap-2 text-xl font-headline font-bold tracking-tight text-white">
<span class="material-symbols-outlined text-indigo-500 text-2xl">account_balance_wallet</span>
            Vayl
        </div>
</header>
<main class="w-full max-w-[480px] px-6 py-20 z-10">
<!-- Signup Card -->
<div class="bg-surface-container/60 backdrop-blur-2xl rounded-2xl p-8 md:p-10 shadow-2xl relative border border-white/5">
<div class="mb-8 text-center">
<h1 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface mb-2">Create your vault</h1>
<p class="text-on-surface-variant text-sm">Secure your knowledge in the digital age.</p>
</div>
<form class="space-y-5">
<!-- Name Field -->
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant" for="full_name">Full Name</label>
<input class="w-full bg-surface-container-highest/50 border border-white/5 text-on-surface placeholder:text-outline/50 p-3.5 rounded-xl focus:ring-2 focus:ring-indigo-500/50 transition-all outline-none text-sm" id="full_name" placeholder="John Doe" type="text"/>
</div>
<!-- Email Field -->
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant" for="email">Email Address</label>
<input class="w-full bg-surface-container-highest/50 border border-white/5 text-on-surface placeholder:text-outline/50 p-3.5 rounded-xl focus:ring-2 focus:ring-indigo-500/50 transition-all outline-none text-sm" id="email" placeholder="john@example.com" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant" for="password">Password</label>
<input class="w-full bg-surface-container-highest/50 border border-white/5 text-on-surface placeholder:text-outline/50 p-3.5 rounded-xl focus:ring-2 focus:ring-indigo-500/50 transition-all outline-none text-sm" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Confirm Password Field -->
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant" for="confirm_password">Confirm Password</label>
<input class="w-full bg-surface-container-highest/50 border border-white/5 text-on-surface placeholder:text-outline/50 p-3.5 rounded-xl focus:ring-2 focus:ring-indigo-500/50 transition-all outline-none text-sm" id="confirm_password" placeholder="••••••••" type="password"/>
</div>
<!-- Action Button -->
<button class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-headline font-bold py-4 rounded-xl transition-all transform active:scale-[0.98] shadow-xl shadow-indigo-600/20 mt-4" type="submit">
                    Unlock Access
                </button>
<!-- Divider -->
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-px bg-white/10"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-[#141a20] px-4 text-[10px] font-label text-outline uppercase tracking-[0.2em]">Social Integration</span>
</div>
</div>
<!-- Social Options -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2.5 bg-white/5 hover:bg-white/10 transition-colors py-3 rounded-xl border border-white/5" type="button">
<svg class="w-4 h-4" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path></svg>
<span class="font-label text-xs font-medium">Google</span>
</button>
<button class="flex items-center justify-center gap-2.5 bg-white/5 hover:bg-white/10 transition-colors py-3 rounded-xl border border-white/5" type="button">
<span class="material-symbols-outlined text-[18px]">terminal</span>
<span class="font-label text-xs font-medium">GitHub</span>
</button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center border-t border-white/5 pt-6">
<p class="text-on-surface-variant text-sm">
                    Already part of the network? 
                    <a class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors" href="#">Login here</a>
</p>
</div>
</div>
<!-- System Message -->
<div class="mt-8 p-4 rounded-xl bg-indigo-500/5 border border-indigo-500/10 flex gap-3 items-center">
<span class="material-symbols-outlined text-indigo-400 text-sm">verified_user</span>
<p class="text-[10px] font-label text-on-surface-variant uppercase tracking-wider">
                End-to-end encrypted protocol active
            </p>
</div>
</main>
<!-- Footer -->
<footer class="mt-auto w-full py-8 border-t border-white/5 flex flex-col md:flex-row justify-between items-center px-12 gap-4 z-10">
<div class="text-xs font-headline font-bold text-slate-500 uppercase tracking-widest">
            © 2024 Vayl Systems.
        </div>
<div class="flex gap-8">
<a class="font-inter text-[10px] uppercase tracking-widest text-slate-600 hover:text-indigo-400 transition-colors" href="#">Terms</a>
<a class="font-inter text-[10px] uppercase tracking-widest text-slate-600 hover:text-indigo-400 transition-colors" href="#">Privacy</a>
<a class="font-inter text-[10px] uppercase tracking-widest text-slate-600 hover:text-indigo-400 transition-colors" href="#">Support</a>
</div>
</footer>
</body></html>
