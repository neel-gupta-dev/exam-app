<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary-fixed-variant": "#4647d3",
              "on-error-container": "#ff97a3",
              "primary-fixed-dim": "#d1d0ff",
              "surface-container-highest": "#1e272f",
              "surface": "#0b0e11",
              "outline": "#6d7680",
              "tertiary-fixed-dim": "#c0c9e6",
              "tertiary-container": "#ced6f5",
              "surface-container-lowest": "#000000",
              "on-secondary-container": "#c1bec3",
              "on-error": "#490013",
              "secondary-container": "#3c3b3f",
              "outline-variant": "#404952",
              "inverse-on-surface": "#535559",
              "on-secondary-fixed-variant": "#5c5b5f",
              "on-primary-fixed": "#2622b7",
              "error-container": "#7f2737",
              "tertiary-fixed": "#ced6f5",
              "on-tertiary-container": "#424a63",
              "surface-container-low": "#0f1418",
              "surface-bright": "#222d37",
              "inverse-primary": "#494bd7",
              "inverse-surface": "#f8f9fe",
              "on-tertiary-fixed": "#2f384f",
              "surface-variant": "#1e272f",
              "primary": "#c0c1ff",
              "on-primary": "#2724b8",
              "background": "#0b0e11",
              "on-secondary-fixed": "#403f43",
              "surface-container-high": "#192027",
              "on-tertiary-fixed-variant": "#4b546d",
              "primary-dim": "#b0b2ff",
              "surface-container": "#141a20",
              "secondary-fixed-dim": "#d6d3d8",
              "primary-fixed": "#e1e0ff",
              "tertiary-dim": "#c0c9e6",
              "tertiary": "#dee5ff",
              "on-background": "#dde6f2",
              "error": "#ec7c8a",
              "surface-dim": "#0b0e11",
              "primary-container": "#2f2ebe",
              "surface-tint": "#c0c1ff",
              "secondary": "#9f9da1",
              "error-dim": "#b95463",
              "secondary-fixed": "#e5e1e6",
              "on-primary-container": "#ccccff",
              "on-secondary": "#202023",
              "on-surface": "#dde6f2",
              "on-tertiary": "#4a536c",
              "secondary-dim": "#9f9da1",
              "on-surface-variant": "#a3acb7"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            background-color: #0b0e11;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        .mesh-grid {
            background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 40px 40px;
        }
        .glass-card {
            background: rgba(20, 26, 32, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="font-body text-on-surface antialiased min-h-screen flex items-center justify-center relative overflow-hidden mesh-grid">
<!-- Dynamic Background Orbs -->
<div class="orb bg-primary w-[500px] h-[500px] -top-48 -left-24 animate-pulse"></div>
<div class="orb bg-on-primary-fixed-variant w-[400px] h-[400px] bottom-0 -right-20" style="animation-delay: 2s;"></div>
<div class="orb bg-tertiary w-[300px] h-[300px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-[0.05]"></div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[440px] px-6">
<!-- Header / Logo Area -->
<div class="mb-12 text-center">
<div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-primary-container to-on-primary-fixed-variant mb-6 shadow-xl shadow-primary-container/20">
<span class="material-symbols-outlined text-3xl text-primary-fixed" data-icon="auto_stories">auto_stories</span>
</div>
<h1 class="font-headline text-4xl font-extrabold tracking-tight text-white mb-3">
                Knowledge Vault
            </h1>
<p class="text-on-surface-variant text-sm font-medium tracking-wide uppercase">
                Access your digital library
            </p>
</div>
<!-- The Central Login Card -->
<section class="glass-card rounded-2xl p-8 shadow-2xl relative overflow-hidden group">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
<h2 class="font-headline text-xl font-bold mb-8 text-on-surface">Welcome back</h2>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label text-xs font-bold text-on-surface-variant ml-1 uppercase tracking-widest" for="email">Email Address</label>
<div class="relative group/input">
<input class="w-full bg-surface-container-highest/50 border border-outline-variant/30 rounded-xl py-3.5 px-4 text-sm text-on-surface placeholder:text-outline/60 focus:ring-2 focus:ring-primary/20 focus:border-primary/50 transition-all outline-none" id="email" name="email" placeholder="scholar@vault.io" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="font-label text-xs font-bold text-on-surface-variant uppercase tracking-widest" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative group/input">
<input class="w-full bg-surface-container-highest/50 border border-outline-variant/30 rounded-xl py-3.5 px-4 text-sm text-on-surface placeholder:text-outline/60 focus:ring-2 focus:ring-primary/20 focus:border-primary/50 transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-3 py-1 ml-1">
<input class="w-4 h-4 rounded-md bg-surface-container-highest border-outline-variant/50 text-primary-container focus:ring-0 focus:ring-offset-0 cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="text-xs font-medium text-on-surface-variant cursor-pointer select-none" for="remember">Keep session active</label>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary-container text-primary-fixed font-headline font-bold py-4 rounded-xl shadow-lg shadow-primary-container/20 hover:bg-on-primary-fixed-variant hover:-translate-y-0.5 active:scale-[0.98] transition-all flex justify-center items-center gap-3 group/btn" type="submit">
                    Unlock Vault
                    <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform" data-icon="key">key</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/10"></div>
</div>
<div class="relative flex justify-center text-[10px]">
<span class="px-4 bg-transparent text-outline font-bold tracking-widest uppercase">External access</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-3 px-4 bg-surface-container-low/40 border border-outline-variant/20 rounded-xl hover:bg-surface-bright/60 hover:border-outline-variant/40 transition-all text-on-surface text-sm font-medium">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="currentColor"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor"></path>
</svg>
                    Google
                </button>
<button class="flex items-center justify-center gap-3 py-3 px-4 bg-surface-container-low/40 border border-outline-variant/20 rounded-xl hover:bg-surface-bright/60 hover:border-outline-variant/40 transition-all text-on-surface text-sm font-medium">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="currentColor"></path>
</svg>
                    GitHub
                </button>
</div>
</section>
<!-- Footer / Redirect -->
<div class="mt-10 text-center">
<p class="text-sm text-on-surface-variant">
                First time here? 
                <a class="text-primary font-bold hover:text-white transition-colors underline underline-offset-8 ml-1" href="#">Request Access</a>
</p>
</div>
</main>
<!-- Page Footer Information -->
<footer class="fixed bottom-0 left-0 w-full py-8 px-12 flex flex-col md:flex-row justify-between items-center gap-6 z-20">
<div class="text-[10px] font-headline font-bold text-outline uppercase tracking-[0.2em] flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-primary/40"></div>
            Knowledge Vault Secure Node
        </div>
<div class="flex gap-8">
<a class="font-inter text-xs text-slate-500 hover:text-primary transition-colors" href="#">Privacy</a>
<a class="font-inter text-xs text-slate-500 hover:text-primary transition-colors" href="#">Terms</a>
<a class="font-inter text-xs text-slate-500 hover:text-primary transition-colors" href="#">Support</a>
</div>
<div class="font-inter text-[10px] text-slate-600 font-medium">
            © 2024 Knowledge Vault. Encrypted Protocol.
        </div>
</footer>
</body></html>
